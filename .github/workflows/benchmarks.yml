name: Ruby SDK benchmarks

on: [pull_request]

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    benchmark:
        runs-on: ubuntu-24.04
        timeout-minutes: 12
        env:
            BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
        strategy:
            fail-fast: false
            matrix:
                shard: [flags-single, flags-scaling, flags-memory, capture]
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12.12'

            - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
              with:
                  ruby-version: '3.4.7'
                  bundler: '4.0.13'
                  bundler-cache: true

            - name: Prepare pinned baseline
              env:
                  TARGET_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  export BASE_WORKTREE="$RUNNER_TEMP/ruby-benchmark-base"
                  export RESULTS="$RUNNER_TEMP/ruby-benchmark-results"
                  printf 'BASE_WORKTREE=%s\nRESULTS=%s\n' "$BASE_WORKTREE" "$RESULTS" >> "$GITHUB_ENV"
                  BASE_SHA=$(git merge-base "$TARGET_SHA" "$HEAD_SHA")
                  git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
                  mkdir -p "$RESULTS"
                  python -c 'import json, os, pathlib, sys; pathlib.Path(os.environ["RESULTS"], "revisions.json").write_text(json.dumps({"target":os.environ["TARGET_SHA"], "head":os.environ["HEAD_SHA"], "base":sys.argv[1]}, indent=2))' "$BASE_SHA"

            - name: Build and install isolated gems
              run: |
                  python -B benchmarks/prepare.py . "$RUNNER_TEMP/ruby-benchmark-build/head"
                  python -B benchmarks/prepare.py "$BASE_WORKTREE" "$RUNNER_TEMP/ruby-benchmark-build/base"

            - name: Test measurement controls and fixtures
              run: |
                  python -B benchmarks/test_benchmarks.py
                  python -B benchmarks/check_native.py "$RUNNER_TEMP/ruby-benchmark-build/head"

            - name: Measure paired base and head
              id: measure
              timeout-minutes: 10
              run: |
                  python -B benchmarks/run.py \
                    --base "$BASE_WORKTREE" \
                    --head "$GITHUB_WORKSPACE" \
                    --build-directory "$RUNNER_TEMP/ruby-benchmark-build" \
                    --output "$RESULTS" \
                    --repetitions 6 \
                    --shard "${{ matrix.shard }}"

            - name: Upload raw shard results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-shard-${{ matrix.shard }}
                  path: |
                      ${{ runner.temp }}/ruby-benchmark-results/base.json
                      ${{ runner.temp }}/ruby-benchmark-results/head.json
                      ${{ runner.temp }}/ruby-benchmark-results/revisions.json
                  if-no-files-found: warn
                  retention-days: 14

    collect:
        needs: benchmark
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Download shard results
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: benchmark-shard-*
                  path: ${{ runner.temp }}/ruby-benchmark-shards
                  merge-multiple: false

            - name: Collect and render benchmark comparison
              uses: PostHog/.github/.github/actions/benchmark-report@04f8421ec4daa7f4066eaeb4c53621ba79ddc3ca # SDK benchmark reporting (PostHog/.github PR #84)
              with:
                  mode: collect
                  source-status: ${{ needs.benchmark.result }}
                  shard-manifest: benchmarks/shards.json
                  shard-directory: ${{ runner.temp }}/ruby-benchmark-shards
                  output-directory: ${{ runner.temp }}/ruby-benchmark-report

            - name: Upload rendered comparison
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ruby-benchmark-report
                  path: |
                      ${{ runner.temp }}/ruby-benchmark-report/report.md
                      ${{ runner.temp }}/ruby-benchmark-report/comparison.json
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Upload raw benchmark results
              if: always()
              id: results
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ruby-benchmark-results
                  path: |
                      ${{ runner.temp }}/ruby-benchmark-report/bundle.json
                      ${{ runner.temp }}/ruby-benchmark-report/revisions.json
                  if-no-files-found: warn
                  retention-days: 14

            - name: Link results
              if: always()
              env:
                  ARTIFACT_URL: ${{ steps.results.outputs.artifact-url }}
              run: |
                  printf '## Ruby SDK benchmark data\n\n' >> "$GITHUB_STEP_SUMMARY"
                  if [[ -n "$ARTIFACT_URL" ]]; then
                    printf '[Download paired measurements and execution metadata](%s)\n\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
                  fi
                  printf 'Measurements are informational. Check workload statuses before comparing values.\n' >> "$GITHUB_STEP_SUMMARY"
