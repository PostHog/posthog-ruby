name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: RSpec (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: [3.2, 3.3, 3.4]
      fail-fast: false
    env:
      RAILS_ENV: test
      GH_ACTIONS_UNIT_TESTS: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: 4.0.13
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true

      - name: Run RSpec tests
        run: bundle exec rspec

  logs-integration:
    name: Logs integration (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: [3.3, 3.4]
      fail-fast: false
    env:
      BUNDLE_GEMFILE: gemfiles/otel.gemfile
      RAILS_ENV: test
      GH_ACTIONS_UNIT_TESTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: 4.0.13
          bundler-cache: true
      - name: Require real OpenTelemetry dependencies
        run: bundle exec ruby -e "require 'opentelemetry-sdk'; require 'opentelemetry-logs-sdk'; require 'opentelemetry/exporter/otlp_logs'"
      - name: Run RSpec with real logs dependencies
        run: bundle exec rspec

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Ruby 3.4
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: 3.4
          bundler: 4.0.13
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  public-api-snapshot:
    name: Public API snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Ruby 3.4
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: 3.4
          bundler: 4.0.13
          bundler-cache: true

      - name: Check public API snapshot
        run: bundle exec rake public_api:check

  gem-build:
    name: Gem build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Ruby 3.4
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: 3.4
          bundler: 4.0.13
          bundler-cache: true

      - name: Build posthog-ruby gem
        run: gem build posthog-ruby.gemspec

      - name: Build posthog-rails gem
        run: gem build posthog-rails.gemspec
        working-directory: posthog-rails
