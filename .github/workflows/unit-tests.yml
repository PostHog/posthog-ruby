name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: RSpec (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: [3.2, 3.3, 3.4]
      fail-fast: false
    env:
      RAILS_ENV: test
      GH_ACTIONS_UNIT_TESTS: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: 4.0.13
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true

      - name: Run RSpec tests
        run: bundle exec rspec

  latest-rails:
    name: RSpec (latest Rails / stable Ruby)
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/otel.gemfile
      RAILS_VERSION: '>= 5.2'
      RAILS_ENV: test
      GH_ACTIONS_UNIT_TESTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use stable Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ruby
          bundler: 4.0.13
      - name: Resolve latest Rails and dependencies
        run: bundle update --all
      - name: Report resolved versions and require logs dependencies
        run: |
          bundle exec ruby -rrails -rjson -ropentelemetry-sdk -ropentelemetry-logs-sdk -ropentelemetry/exporter/otlp_logs -e 'puts "Ruby #{RUBY_VERSION}, Rails #{Rails.version}, JSON #{JSON::VERSION}"'
      - name: Run RSpec tests
        run: bundle exec rspec

  logs-integration:
    name: Logs integration (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: [3.3, 3.4]
      fail-fast: false
    env:
      BUNDLE_GEMFILE: gemfiles/otel.gemfile
      RAILS_ENV: test
      GH_ACTIONS_UNIT_TESTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: 4.0.13
          bundler-cache: true
      - name: Require real OpenTelemetry dependencies
        run: bundle exec ruby -e "require 'opentelemetry-sdk'; require 'opentelemetry-logs-sdk'; require 'opentelemetry/exporter/otlp_logs'"
      - name: Run RSpec with real logs dependencies
        run: bundle exec rspec

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Ruby 3.4
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 3.4
          bundler: 4.0.13
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  public-api-snapshot:
    name: Public API snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Ruby 3.4
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 3.4
          bundler: 4.0.13
          bundler-cache: true

      - name: Check public API snapshot
        run: bundle exec rake public_api:check

  gem-build:
    name: Gem build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Ruby 3.4
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 3.4
          bundler: 4.0.13
          bundler-cache: true

      - name: Build posthog-ruby gem
        run: gem build posthog-ruby.gemspec

      - name: Build posthog-rails gem
        run: gem build posthog-rails.gemspec
        working-directory: posthog-rails
