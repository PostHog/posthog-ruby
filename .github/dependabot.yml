version: 2
updates:
  - package-ecosystem: "bundler"
    directories:
      - "/"
      - "/gemfiles/rails-latest"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # commander 6 requires Ruby 3.1, but Dependabot resolves with the gemspec's Ruby 3.0 floor.
      - dependency-name: "commander"
        update-types: ["version-update:semver-major"]
    groups:
      bundler-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      release-tooling:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
